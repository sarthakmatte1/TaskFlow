---
# ── Secrets ────────────────────────────────────────────────────────────
# Values must be base64-encoded.
# Encode:  echo -n "your-value" | base64
# Decode:  echo "encoded" | base64 -d
#
# DO NOT commit real secrets to git.
# In production use: Sealed Secrets, AWS Secrets Manager, or Vault.
#
# Example encoding:
#   echo -n "taskflowpass"   | base64  →  dGFza2Zsb3dwYXNz
#   echo -n "rootpassword"   | base64  →  cm9vdHBhc3N3b3Jk

apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow
type: Opaque
data:
  # Replace ALL values below with your own base64-encoded secrets
  MYSQL_ROOT_PASSWORD: eW91ci1yb290LXBhc3N3b3Jk       # "rootpassword"
  MYSQL_PASSWORD:      dGFza2Zsb3dfcGFzc3dvcmQ=         # "taskflowpass"
  SECRET_KEY:          eW91ci1qd3Qtc2VjcmV0  # "change-me-in-production"
